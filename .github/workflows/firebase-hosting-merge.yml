name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with production configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: better-every-day-594e0
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_PUSH_API_URL: ${{ vars.VITE_PUSH_API_URL }}
        shell: bash
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID VITE_WEB_PUSH_PUBLIC_KEY VITE_PUSH_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository variable before deploying to live Hosting."
              exit 1
            fi
          done
          npm run build
      - name: Deploy private Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BETTER_EVERY_DAY_594E0 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/better-every-day-firebase.json
        shell: bash
        run: |
          umask 077
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node --input-type=module -e 'import fs from "node:fs"; const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, JSON.stringify(account), { mode: 0o600 });'
          unset FIREBASE_SERVICE_ACCOUNT
          npx --yes firebase-tools@15.35.0 deploy --only firestore:rules --project better-every-day-594e0 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BETTER_EVERY_DAY_594E0 }}
          channelId: live
          projectId: better-every-day-594e0
