name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix cloudflare
      - run: npm test --prefix cloudflare
      - run: npm run check --prefix cloudflare
      - run: node --check functions/index.js
      - run: npm test
      - run: npm run build
